
<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>Лапа Карта</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>

body {
    margin: 0;
}

#map {
    height: 100vh;
}

</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([57.1522, 65.5272], 12);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom: 19
}
).addTo(map);


L.circleMarker([57.177311, 65.568046], {
    radius: 8,
    color: 'red'
}).addTo(map)
.bindPopup(`
🐕 Собак: 4<br>
⚠️ Агрессия: да<br>
📝 Возле школы
`);

L.circleMarker([57.177334, 65.568027], {
    radius: 8,
    color: 'green'
}).addTo(map)
.bindPopup(`
🐕 Собак: 5<br>
⚠️ Агрессия: нет<br>
📝 У гаража
`);


</script>

</body>
</html>
