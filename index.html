
<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>Лапа Карта</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>

body {
    margin: 0;
}

#map {
    height: 100vh;
}

</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([57.1522, 65.5272], 12);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom: 19
}
).addTo(map);


L.circleMarker([57.177313, 65.567942], {
    radius: 16,
    weight: 3,
    fillOpacity: 0.9,
    color: 'green'
}).addTo(map)
.bindPopup(`
🐕 Собак: 1<br>
⚠️ Агрессия: нет<br>
📝 да
`);

L.circleMarker([57.177244, 65.568], {
    radius: 16,
    weight: 3,
    fillOpacity: 0.9,
    color: 'red'
}).addTo(map)
.bindPopup(`
🐕 Собак: 1<br>
⚠️ Агрессия: да<br>
📝 очень злая собака
`);

L.circleMarker([57.177348, 65.567862], {
    radius: 16,
    weight: 3,
    fillOpacity: 0.9,
    color: 'red'
}).addTo(map)
.bindPopup(`
🐕 Собак: 4<br>
⚠️ Агрессия: да<br>
📝 аааа помагите
`);

L.circleMarker([57.177329, 65.567674], {
    radius: 16,
    weight: 3,
    fillOpacity: 0.9,
    color: 'green'
}).addTo(map)
.bindPopup(`
🐕 Собак: 4<br>
⚠️ Агрессия: нет<br>
📝 J
`);


</script>

</body>
</html>
